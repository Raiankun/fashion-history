<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画家を知る</title>
<meta name="description" content="画家の生涯、要点、名言、代表作を図表で紹介するページ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Noto+Serif+JP:wght@300;400;500&family=Noto+Sans+JP:wght@400;500&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body class="impression detail-page">

<nav class="genre wrap" aria-label="分野">
  <a href="index.html">ファッション</a>
  <a href="painting.html" aria-current="page">絵画</a>
  <a href="philosophy.html">哲学</a>
</nav>

<main class="wrap" id="page"></main>
<div class="tip" id="tip" role="tooltip" hidden></div>

<script src="data/painting.js"></script>
<script src="data/painting-detail.js"></script>
<script>
const $ = s => document.querySelector(s);
const WIKI = "https://en.wikipedia.org/wiki/";
const yearsOf = a => { const m = a[3].match(/(\d{3,4}).*?–\s*(\d{4})?/); return [+m[1], m[2] ? +m[2] : null]; };
const NOW = 2026;

/* ツールチップ：data-tip を持つ要素に重ねる・タップすると表示 */
const tip = $("#tip");
document.addEventListener("pointerover", e => {
  const t = e.target.closest("[data-tip]"); if (!t) { tip.hidden = true; return; }
  tip.innerHTML = t.dataset.tip; tip.hidden = false;
  const r = t.getBoundingClientRect(), w = tip.offsetWidth;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px";
  tip.style.top = (r.top + scrollY - tip.offsetHeight - 10) + "px";
});

const id = new URLSearchParams(location.search).get("id") || ARTISTS[0][0];
const idx = Math.max(0, ARTISTS.findIndex(a => a[0] === id));
const a = ARTISTS[idx], d = ARTIST_DETAIL[a[0]] || {pts:[], life:[], works:[], from:[], to:[]};
const m = MOVEMENTS.find(x => x.id === a[5]);
const [born, died] = yearsOf(a), end = died || NOW;
document.title = `${a[1]}｜画家を知る`;

/* 図1：生涯と作品の年表（上：出来事、下：作品） */
function lifeChart(){
  const W = 900, H = 190, L = 24, R = 24, Y = 96;
  const x = y => L + (y - born) / Math.max(1, end - born) * (W - L - R);
  const step = (end - born) > 60 ? 10 : 5;
  let g = `<line x1="${L}" y1="${Y}" x2="${W-R}" y2="${Y}" stroke="var(--hair)" stroke-width="2"/>`;
  g += `<rect x="${L}" y="${Y-3}" width="${x(end)-L}" height="6" rx="3" fill="color-mix(in srgb,var(--mc) 45%,#fff)"/>`;
  for (let t = Math.ceil(born / step) * step; t <= end; t += step){
    g += `<line x1="${x(t)}" y1="${Y+6}" x2="${x(t)}" y2="${Y+12}" stroke="var(--sub)" stroke-width="1"/><text x="${x(t)}" y="${Y+26}" text-anchor="middle" class="ax">${t}</text>`;
  }
  d.life.forEach((e, i) => {
    const h = 22 + (i % 3) * 18;
    g += `<line x1="${x(e[0])}" y1="${Y-6}" x2="${x(e[0])}" y2="${Y-h}" stroke="var(--sub)" stroke-width="1"/>
      <circle class="hit" cx="${x(e[0])}" cy="${Y-h}" r="7" fill="var(--ink)" stroke="#fff" stroke-width="2" data-tip="<b>${e[0]}年（${e[0]-born}歳ごろ）</b><br>${e[1]}"/>`;
  });
  d.works.forEach((w, i) => {
    const h = 40 + (i % 3) * 16;
    g += `<line x1="${x(w[1])}" y1="${Y+6}" x2="${x(w[1])}" y2="${Y+h}" stroke="var(--mc)" stroke-width="1"/>
      <rect class="hit" x="${x(w[1])-7}" y="${Y+h-7}" width="14" height="14" rx="4" fill="var(--mc)" stroke="#fff" stroke-width="2" data-tip="<b>${w[0]}</b><br>${w[1]}年（${w[1]-born}歳ごろ）"/>`;
  });
  g += `<text x="${L}" y="14" class="lg"><tspan class="dot-ink">●</tspan> 人生の出来事　<tspan class="dot-mc">■</tspan> 作品</text>`;
  return `<svg viewBox="0 0 ${W} ${H+20}" class="chart" role="img" aria-label="${a[1]}の生涯の出来事と作品を年代順に並べた図">${g}</svg>`;
}

/* 図2：同時代の画家（生涯の長さを横棒で） */
function peersChart(){
  const rows = ARTISTS.map(p => { const [b, e] = yearsOf(p); return {p, b, e: e || NOW, alive: !e}; }).sort((u, v) => u.b - v.b);
  const lo = born - 150, hi = end + 150;
  const list = rows.filter(r => r.e >= lo && r.b <= hi);
  const W = 960, L = 220, R = 20, RH = 26, H = list.length * RH + 40;
  const min = Math.min(...list.map(r => r.b)), max = Math.max(...list.map(r => r.e));
  const x = y => L + (y - min) / (max - min) * (W - L - R);
  let g = "";
  for (let t = Math.ceil(min / 50) * 50; t <= max; t += 50) g += `<line x1="${x(t)}" y1="10" x2="${x(t)}" y2="${H-24}" stroke="var(--hair)" stroke-width="1"/><text x="${x(t)}" y="${H-8}" text-anchor="middle" class="ax">${t}</text>`;
  g += `<rect x="${x(born)}" y="10" width="${x(end)-x(born)}" height="${H-34}" fill="color-mix(in srgb,var(--mc) 10%,transparent)"/>`;
  list.forEach((r, i) => {
    const me = r.p[0] === a[0], y = 14 + i * RH;
    g += `<a href="artist.html?id=${r.p[0]}"><text x="${L-10}" y="${y+12}" text-anchor="end" class="rl${me ? " me" : ""}">${r.p[1]}</text>
      <rect class="hit" x="${x(r.b)}" y="${y+2}" width="${Math.max(4, x(r.e)-x(r.b))}" height="14" rx="4" fill="${me ? "var(--ox)" : "color-mix(in srgb,var(--sub) 35%,#fff)"}" data-tip="<b>${r.p[1]}</b><br>${r.p[3]}${r.alive ? "（存命）" : ""}"/></a>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${a[1]}と前後150年の画家の生涯の比較">${g}</svg>`;
}

const flow = (from, to) => `<div class="flowmap">
  <div class="fcol">${from.map(t => `<span class="fnode">${t}</span>`).join("") || `<span class="fnode muted">―</span>`}</div>
  <div class="farrow" aria-hidden="true">→</div>
  <div class="fcol"><span class="fnode me">${a[1]}</span></div>
  <div class="farrow" aria-hidden="true">→</div>
  <div class="fcol">${to.map(t => `<span class="fnode">${t}</span>`).join("") || `<span class="fnode muted">―</span>`}</div>
 </div>
 <div class="flowkey"><span>影響を受けた</span><span></span><span>影響を与えた</span></div>`;

const timeline = [...d.life.map(e => [e[0], e[1], "出来事"]), ...d.works.map(w => [w[1], w[0], "作品"])].sort((u, v) => u[0] - v[0]);
const prev = ARTISTS[(idx - 1 + ARTISTS.length) % ARTISTS.length], next = ARTISTS[(idx + 1) % ARTISTS.length];

$("#page").style.setProperty("--mc", m.c);
$("#page").innerHTML = `
 <a class="back linkbtn" href="painting.html#artists">← 画家の一覧へ</a>
 <header class="dp-hero">
  <a class="portrait big" href="${WIKI + a[2]}" target="_blank" rel="noopener" ${a[11] ? `data-portrait="${a[2]}"` : ""}><span>${a[1].slice(0,1)}</span></a>
  <div>
   <div class="eyebrow">${a[2].replace(/_/g, " ")}</div>
   <h1>${a[1]}</h1>
   <div class="dp-meta"><span>${a[3]}</span><span>${a[4]}</span><a class="mpill" href="painting.html#${m.id}" style="--mc:${m.c}">${m.t}</a></div>
  </div>
 </header>
 <p class="dp-lead">${a[6]}</p>

 <h2 class="dp-h">要点</h2>
 <ol class="points">${d.pts.map(p => `<li>${p}</li>`).join("")}</ol>

 ${a[10] ? `<h2 class="dp-h">言葉</h2><figure class="bigquote"><blockquote>「${a[10][0]}」</blockquote><figcaption>${a[1]}　${a[10][1]}</figcaption></figure>` : ""}

 <h2 class="dp-h">図1　生涯と作品</h2>
 <p class="caption">点にマウスを重ねる（スマホはタップ）と内容が出ます。</p>
 <div class="chart-wrap">${lifeChart()}</div>
 <div class="tbl-wrap"><table class="tbl timeline">${table(["年","年齢","種類","内容"], timeline.map(t => [`<span class="latin">${t[0]}</span>`, `${t[0] - born}歳`, `<span class="kind-${t[2] === "作品" ? "w" : "l"}">${t[2]}</span>`, t[1]]))}</table></div>

 <h2 class="dp-h">画風</h2>
 <ul class="signs">${a[7].map(s => `<li>${s}</li>`).join("")}</ul>
 <dl class="kv" style="margin-top:14px"><div><dt>エピソード</dt><dd>${a[9]}</dd></div></dl>

 <h2 class="dp-h">図2　影響の流れ</h2>
 ${flow(d.from, d.to)}

 <h2 class="dp-h">図3　同時代の画家</h2>
 <p class="caption">前後150年に生きた画家との比較です。帯は${a[1]}の生涯。名前や棒を押すとその画家のページへ移動します。</p>
 <div class="chart-wrap">${peersChart()}</div>

 <nav class="pager">
  <a href="artist.html?id=${prev[0]}">← ${prev[1]}</a>
  <a href="artist.html?id=${next[0]}">${next[1]} →</a>
 </nav>
 <p class="notice">出典：<a href="${WIKI + a[2]}" target="_blank" rel="noopener">Wikipedia（英語）</a>、流派は ${m.src.map(s => `<a href="${WIKI + s}" target="_blank" rel="noopener">${s.replace(/_/g, " ")}</a>`).join("、")}。年は推定を含みます。言葉の「当サイト訳」は原文からの当サイトによる訳・要旨です。</p>`;

function table(head, rows){ return `<thead><tr>${head.map(h => `<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c,i) => `<td data-l="${head[i]}"><span>${c}</span></td>`).join("")}</tr>`).join("")}</tbody>`; }

/* 肖像：パブリックドメインの代表画像がある画家だけ */
(async () => {
  const el = document.querySelector("[data-portrait]"); if (!el) return;
  try {
    const r = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(el.dataset.portrait));
    const u = r.ok ? ((await r.json()).thumbnail || {}).source : null; if (!u) return;
    const img = new Image(); img.alt = ""; img.onload = () => { el.innerHTML = ""; el.appendChild(img); }; img.src = u;
  } catch(_) {}
})();
</script>
</body>
</html>
